version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: vs_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: virtualsphere2024
      MONGO_INITDB_DATABASE: virtualsphere
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - virtualsphere

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: vs_redis
    restart: unless-stopped
    command: redis-server --requirepass virtualsphere2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - virtualsphere

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vs_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:virtualsphere2024@mongodb:27017/virtualsphere?authSource=admin
      REDIS_URL: redis://:virtualsphere2024@redis:6379
      JWT_SECRET: your_super_secret_jwt_key_development
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4
      LLM_INSTANCE_PREFIX: vs_llm_
      VH_AUTONOMY_LEVEL: 0.8
      RATE_LIMIT_WINDOW: 15
      RATE_LIMIT_MAX_REQUESTS: 100
      LOG_LEVEL: info
      SWAGGER_ENABLED: true
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - virtualsphere

  # Frontend Next.js App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vs_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
      NEXT_PUBLIC_BLOCKCHAIN_NETWORK: polygon-mumbai
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - virtualsphere

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vs_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - virtualsphere

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  virtualsphere:
    driver: bridge
    name: virtualsphere-network
