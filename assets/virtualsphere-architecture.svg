<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" fill="url(#headerGradient)" stroke="#4a5568" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="400" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    VirtualSphere Patent Architecture
  </text>
  
  <!-- Frontend Layer -->
  <rect x="20" y="100" width="760" height="50" fill="#e2e8f0" stroke="#4a5568" stroke-width="1" rx="4"/>
  <text x="200" y="130" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Frontend (React/Next.js)
  </text>
  <text x="600" y="130" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Real-time Engine (Socket.IO)
  </text>
  
  <!-- Patent Core Services Header -->
  <rect x="20" y="170" width="760" height="40" fill="url(#coreGradient)" stroke="#4a5568" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="400" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Patent Core Services Layer (Node.js/Express)
  </text>
  
  <!-- Core Services Row 1 -->
  <rect x="20" y="230" width="180" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="110" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Personal LLM</text>
  <text x="110" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Orchestrator</text>
  
  <rect x="210" y="230" width="180" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="300" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Virtual Human</text>
  <text x="300" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Agent Service</text>
  
  <rect x="400" y="230" width="180" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="490" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Dynamic World</text>
  <text x="490" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Generation</text>
  
  <rect x="590" y="230" width="190" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="685" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Emotion/Context</text>
  <text x="685" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Analysis</text>
  
  <!-- Core Services Row 2 -->
  <rect x="20" y="320" width="180" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="110" y="345" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">User Matching</text>
  <text x="110" y="365" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Engine</text>
  
  <rect x="210" y="320" width="180" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="300" y="345" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Collaboration</text>
  <text x="300" y="365" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Engine</text>
  
  <rect x="400" y="320" width="180" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="490" y="345" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Blockchain</text>
  <text x="490" y="365" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Service</text>
  
  <rect x="590" y="320" width="190" height="70" fill="url(#serviceGradient)" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="685" y="345" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Reward System</text>
  
  <!-- Data Layer Header -->
  <rect x="20" y="410" width="760" height="40" fill="url(#dataGradient)" stroke="#4a5568" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="400" y="435" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Data &amp; Storage Layer
  </text>
  
  <!-- Data Storage Components -->
  <rect x="20" y="470" width="180" height="80" fill="#68d391" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="110" y="500" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">MongoDB</text>
  <text x="110" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">(Primary DB)</text>
  
  <rect x="210" y="470" width="180" height="80" fill="#68d391" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="300" y="500" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Redis Cache</text>
  <text x="300" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">(Sessions)</text>
  
  <rect x="400" y="470" width="180" height="80" fill="#68d391" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="490" y="500" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Blockchain</text>
  <text x="490" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">(Assets)</text>
  
  <rect x="590" y="470" width="190" height="80" fill="#68d391" stroke="#4a5568" stroke-width="1" rx="4" filter="url(#shadow)"/>
  <text x="685" y="500" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">File Storage</text>
  <text x="685" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">(Media)</text>
  
  <!-- Connection Lines -->
  <line x1="400" y1="150" x2="400" y2="170" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="210" x2="400" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="390" x2="400" y2="410" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="450" x2="400" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- Patent Badge -->
  <rect x="650" y="570" width="130" height="25" fill="#ff6b6b" stroke="#e63946" stroke-width="1" rx="12" filter="url(#shadow)"/>
  <text x="715" y="587" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
    🔬 PATENT PROTECTED
  </text>
</svg>